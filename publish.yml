    - "src/Kavita.AniListNet/Kavita.AniListNet.csproj"

BuildLibrary:
  CsprojPath: "src/Kavita.AniListNet/Kavita.AniListNet.csproj"
  OutputDirectory: "output"

PublishToNuGet:
  OutputDirectory: "output"
