# yaml-language-server: $schema=../GitHubActions/Kavita.ReleaseTools.schema.json

CsprojPath: "src/Kavita.AniListNet/Kavita.AniListNet.csproj"
VersionXmlElement: "Version"

# Always be Stable release
ParseReleaseTypes:
  BranchRequirements:
    Stable:
      DoesNotContain: [ ]
      StartWiths: ""

